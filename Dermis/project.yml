name: DermisStudio
options:
  bundleIdPrefix: com.dermis
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
packages:
  DermisCore:
    path: Packages/DermisCore
  DermisDevice:
    path: Packages/DermisDevice
  DermisRender:
    path: Packages/DermisRender
targets:
  DermisStudio:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: DermisCore
      - package: DermisDevice
      - package: DermisRender
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dermis.studio
        PRODUCT_NAME: Dermis Studio
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dermis Studio
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ENABLE_APP_SANDBOX: NO
        CODE_SIGNING_ALLOWED: NO
    scheme:
      testTargets: []

