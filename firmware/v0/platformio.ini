[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino

# This module reports 32 MB octal flash and 16 MB octal PSRAM. The generic
# DevKitC profile defaults to quad flash/no PSRAM and crashes during core init.
board_build.arduino.memory_type = opi_opi
board_build.flash_mode = dout
board_build.f_flash = 80000000L
board_build.partitions = large_littlefs_32MB.csv
board_upload.flash_size = 32MB
board_upload.maximum_size = 4718592

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

upload_protocol = esptool
# Let PlatformIO auto-detect the UART bridge. Do not pin a transient
# /dev/cu.usbmodem* name here.

lib_deps =
    adafruit/Adafruit MLX90393@2.0.5
    links2004/WebSockets@2.4.1
    bblanchon/ArduinoJson@7.4.2

build_flags =
    -Wall
    -Wextra
    -Werror=return-type
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s3_jtag]
extends = env:esp32s3
upload_protocol = esp-builtin
